# Build the Juice Shop image and run the security scanners.
# Phase 1: build. Phase 2: gitleaks. Phase 3: trivy. Phase 4: semgrep. Phase 5: checkov.
# Scan jobs never fail on findings: they upload their report as an artifact, and triage (phase 7)
# is the only job that decides pass/fail.
#
# Deliberately not hardened yet (phase 9, .claude/rules/ci-workflows.md): actions use version tags
# (not commit SHAs), checkout keeps its credentials, and there is no concurrency group. Phase 5
# (Checkov) found: all GHA checks pass (no write-all, shell injection, or deprecated commands);
# SHA-pinning of actions and general job-level permissions are not detectable by Checkov (phase 9
# will add zizmor). timeout-minutes is set now: the default is 360 minutes, and a hung npm install
# would burn them.
name: security

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Build image
        run: docker build -t juice-shop:ci ./app

      # Scan jobs that need the image (trivy, later zap) get it as a tar instead of rebuilding.
      # upload-artifact zips it (~115 MB). Kept for 1 day: it's only needed within this run.
      - name: Save image
        run: docker save juice-shop:ci -o "$RUNNER_TEMP/juice-shop.tar"

      - uses: actions/upload-artifact@v7
        with:
          name: juice-shop-image
          path: ${{ runner.temp }}/juice-shop.tar
          if-no-files-found: error
          retention-days: 1
          compression-level: 0 # image layers are already compressed

  gitleaks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history; the default (1) would scan only the last commit

      # --exit-code 0: findings don't fail the job, triage decides.
      # --log-opts: scan everything reachable from the commit being built (its full history), not
      #   `--all` refs: fetch-depth 0 also fetches other branches, whose secrets aren't this build's.
      #   --diff-filter=tuxdb is gitleaks' default, which a custom --log-opts would otherwise drop.
      # --user: run as the runner's UID, so git sees the repo as ours and files aren't root-owned.
      # --exit-code 0 also hides git errors: gitleaks then logs ERR, scans 0 commits and writes a
      #   valid, empty report. The checks below turn that into a failure, so an empty report
      #   always means "no findings", never "nothing was scanned".
      # No --redact: triage fingerprints secrets as rule + file + sha256(secret)
      #   (.claude/rules/triage-script.md), and a redacted report would give every finding the same
      #   hash. The raw report stays in $RUNNER_TEMP; only a copy with each secret replaced by its
      #   sha256 and the matched text removed goes into reports/ and the artifact.
      - name: Scan git history
        run: |
          set -euo pipefail
          mkdir -p reports
          if [ "$(git rev-parse --is-shallow-repository)" != false ]; then
            echo "::error::shallow clone: gitleaks would not see the full history"; exit 1
          fi
          log="$RUNNER_TEMP/gitleaks.log"
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/repo:ro" -v "$RUNNER_TEMP:/out" \
            zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git /repo --config /repo/.gitleaks.toml --exit-code 0 --no-banner \
            --log-opts="--full-history --diff-filter=tuxdb HEAD" \
            --report-format json --report-path /out/gitleaks-raw.json 2>"$log" \
            || { cat "$log"; exit 1; }
          sed -i 's/\x1b\[[0-9;]*m//g' "$log" # strip colour codes so the greps below match
          cat "$log"
          if grep -qE ' (ERR|FTL) ' "$log"; then
            echo "::error::gitleaks logged an error; the report may be incomplete"; exit 1
          fi
          scanned=$(grep -oE '[0-9]+ commits scanned' "$log" | grep -oE '^[0-9]+' || true)
          if [ "${scanned:-0}" -eq 0 ]; then
            echo "::error::gitleaks scanned 0 commits"; exit 1
          fi

      - name: Hash secrets in the report
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/gitleaks-raw.json" reports/gitleaks.json <<'EOF'
          import hashlib, json, sys
          findings = json.load(open(sys.argv[1]))
          for f in findings:
              f["Secret"] = "sha256:" + hashlib.sha256(f["Secret"].encode()).hexdigest()
              f["Match"] = "REDACTED"
          json.dump(findings, open(sys.argv[2], "w"), indent=1)
          print(f"{len(findings)} findings, secrets hashed")
          EOF
          rm -f "$RUNNER_TEMP/gitleaks-raw.json"

      - uses: actions/upload-artifact@v7
        with:
          name: gitleaks-report
          path: reports/gitleaks.json
          if-no-files-found: error # a missing report must not look like "no findings"
          retention-days: 7

  trivy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30 # two scans with --timeout 10m each, plus a DB download on a cold cache
    permissions:
      contents: read
    env:
      TRIVY_IMAGE: aquasec/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: juice-shop-image
          path: ${{ runner.temp }}

      # Vulnerability DB cache (~100 MB download, 1.4 GB on disk). Trivy re-downloads the DB
      # once it is older than its NextUpdate (24 h after it was built), so the cache is keyed on
      # the DB's own UpdatedAt, not the date: restore the newest entry, and save only when the
      # scan fetched a newer DB. That's one save per DB build. Only db/ is cached; Trivy's
      # per-layer scan cache (fanal/) would grow with every rebuild of the image.
      - name: Restore Trivy DB
        id: db-restore
        uses: actions/cache/restore@v6
        with:
          path: .cache/trivy/db
          key: trivy-db-restore # never saved under this name; restore-keys picks the newest
          restore-keys: trivy-db-

      # Scans run one after the other: they share the DB cache, which allows one process at a time.
      # --input reads the saved tar, so the container never gets the Docker socket.
      # No --ignore-unfixed and no --severity: triage needs every finding (KEV applies at any
      # severity, and unfixed ones are reported without blocking). The exit code stays at Trivy's
      # default 0 on findings, so a non-zero exit is a real error and fails the job.
      - name: Scan image and lockfiles
        run: |
          set -euo pipefail
          mkdir -p reports .cache/trivy
          trivy() {
            docker run --rm --user "$(id -u):$(id -g)" \
              -v "$PWD:/src" -v "$RUNNER_TEMP:/in:ro" -v "$PWD/.cache/trivy:/cache" \
              "$TRIVY_IMAGE" --cache-dir /cache --skip-version-check --disable-telemetry "$@"
          }
          trivy image --input /in/juice-shop.tar --scanners vuln --skip-java-db-update \
            --format json --list-all-pkgs --timeout 10m -o /src/reports/trivy-image.json
          trivy fs --scanners vuln --skip-java-db-update \
            --format json --list-all-pkgs --timeout 10m -o /src/reports/trivy-fs.json /src/app

      # A scan can succeed and still cover less than expected, e.g. OS detection fails and every
      # OS-package CVE silently disappears. A clean scan still lists packages; a broken one doesn't.
      - name: Check scan coverage
        run: |
          set -euo pipefail
          pkgs() { jq --arg c "$2" '[.Results[]? | select(.Class == $c) | .Packages // [] | length] | add // 0' "$1"; }
          fail=0
          os=$(jq -r '.Metadata.OS.Family // empty' reports/trivy-image.json)
          [ -n "$os" ] || { echo "::error::image scan: no OS detected, OS packages were not scanned"; fail=1; }
          [ "$(pkgs reports/trivy-image.json os-pkgs)" -gt 0 ] || { echo "::error::image scan: 0 OS packages"; fail=1; }
          [ "$(pkgs reports/trivy-image.json lang-pkgs)" -gt 0 ] || { echo "::error::image scan: 0 npm packages"; fail=1; }
          for lock in package-lock.json frontend/package-lock.json; do
            n=$(jq --arg t "$lock" '[.Results[]? | select(.Target == $t) | .Packages // [] | length] | add // 0' reports/trivy-fs.json)
            [ "$n" -gt 0 ] || { echo "::error::fs scan: $lock not scanned"; fail=1; }
          done
          jq -r '"image: \(.Metadata.OS.Family) \(.Metadata.OS.Name)"' reports/trivy-image.json
          for f in reports/trivy-image.json reports/trivy-fs.json; do
            jq -r --arg f "$f" '.Results[]? | "\($f) \(.Target): \(.Packages // [] | length) packages, \(.Vulnerabilities // [] | length) vulnerability rows"' "$f"
          done
          exit "$fail"

      - uses: actions/upload-artifact@v7
        with:
          name: trivy-reports
          path: |
            reports/trivy-image.json
            reports/trivy-fs.json
          if-no-files-found: error
          retention-days: 7

      # A report that failed the coverage check is still useful for debugging. It's uploaded
      # under a different name so triage can never mistake it for a good one.
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: trivy-reports-incomplete
          path: reports/trivy-*.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Trivy DB cache key
        id: db-version
        run: |
          set -euo pipefail
          v=$(jq -r '.UpdatedAt' .cache/trivy/db/metadata.json | tr -c 'A-Za-z0-9\n' '-')
          echo "key=trivy-db-$v" >> "$GITHUB_OUTPUT"

      - name: Save Trivy DB
        if: steps.db-restore.outputs.cache-matched-key != steps.db-version.outputs.key
        uses: actions/cache/save@v6
        with:
          path: .cache/trivy/db
          key: ${{ steps.db-version.outputs.key }}

  semgrep:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      # Registry rulesets, fetched at scan time (so results can change between runs of the same
      # commit; see docs/findings/semgrep.md). --metrics=off: nothing is sent to Semgrep.
      # No --error: findings exit 0, triage decides. A non-zero exit is a real error and fails.
      # .semgrepignore at the repo root replaces Semgrep's built-in ignore defaults.
      # HOME=/tmp: Semgrep writes a settings file there, and the runner's UID has no home in
      # the image.
      - name: Scan app/
        run: |
          set -euo pipefail
          mkdir -p reports
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -v "$PWD:/src" -w /src \
            semgrep/semgrep:1.179.0@sha256:93963d9295a366f59e4850127b1550400ee7b388f04fe144e4a1f6325d96e01b \
            semgrep scan app \
              --config p/default --config p/javascript --config p/typescript \
              --metrics=off --disable-version-check \
              --json-output=reports/semgrep.json --sarif-output=reports/semgrep.sarif

      # Semgrep can exit 0 while covering less: parse errors and timeouts only appear in
      # errors[], and skipped files are just absent. Fail unless every tracked first-party server
      # file was scanned and the only errors are the known partial parses of Angular templates.
      # rsn/ is left out on purpose: dev tooling (`npm run rsn`) that never runs in production.
      - name: Check scan coverage
        run: |
          set -euo pipefail
          r=reports/semgrep.json
          fail=0
          # Pathspec * matches across /, so lib/startup/ etc. are included.
          expected=$(git ls-files 'app/routes/*.ts' 'app/lib/*.ts' 'app/models/*.ts' \
            'app/data/*.ts' 'app/views/*' app/server.ts app/app.ts \
            ':(exclude)app/data/static/codefixes/*' | LC_ALL=C sort)
          # Guard against a vacuous pass: an empty list would make every comparison succeed.
          if [ "$(grep -c . <<<"$expected")" -lt 100 ]; then
            echo "::error::expected-file list is suspiciously short; check the pathspecs"; exit 1
          fi
          missing=$(comm -23 <(echo "$expected") <(jq -r '.paths.scanned[]' "$r" | LC_ALL=C sort))
          if [ -n "$missing" ]; then
            echo "::error::first-party server files not scanned:"; echo "$missing"; fail=1
          fi
          unexpected=$(jq -r '.errors[]
            | select((.type | type) != "array" or .type[0] != "PartialParsing"
                     or ((.path // "") | test("\\.component\\.html$") | not))
            | "\(.type | if type == "array" then .[0] else . end): \(.path // .message // "-")"' "$r")
          if [ -n "$unexpected" ]; then
            echo "::error::unexpected scan errors:"; echo "$unexpected"; fail=1
          fi
          jq -r '"semgrep \(.version): \(.paths.scanned | length) files scanned, \(.errors | length) errors, \(.results | length) findings"' "$r"
          jq -r '.results[].extra.severity' "$r" | sort | uniq -c
          exit "$fail"

      - uses: actions/upload-artifact@v7
        with:
          name: semgrep-reports
          path: |
            reports/semgrep.json
            reports/semgrep.sarif
          if-no-files-found: error
          retention-days: 7

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: semgrep-reports-incomplete
          path: reports/semgrep.*
          if-no-files-found: ignore
          retention-days: 7

  checkov:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      CHECKOV_IMAGE: bridgecrew/checkov:3.3.22@sha256:617c76e3f9b1f7907ebca9abb6b9d746844edcb48e9bd775e4692c69c1c6ac47
    steps:
      - uses: actions/checkout@v7

      # Frameworks, skip-paths, and soft-fail are controlled via .checkov.yaml (single source of truth).
      # --soft-fail is also specified on the command line to guarantee scan jobs never fail on
      # findings (independent of the config file). --network none, --user, and mount paths ensure
      # isolation and proper ownership.
      # With multiple -o formats, --output-file-path requires one file path per format, in order.
      # Stderr and stdout are redirected to separate files; stderr is also echoed to the job log.
      # Exit code is preserved via rc variable (docker may exit non-zero on output errors).
      - name: Scan Dockerfiles and workflows
        run: |
          set -euo pipefail
          mkdir -p reports/checkov
          rc=0
          docker run --rm --network none --user "$(id -u):$(id -g)" \
            -v "$PWD:/src:ro" -v "$PWD/reports/checkov:/out" \
            "$CHECKOV_IMAGE" \
            -d /src \
            --config-file /src/.checkov.yaml \
            --soft-fail \
            -o cli -o json -o sarif \
            --output-file-path console,/out/results_json.json,/out/results_sarif.sarif \
            2>reports/checkov/checkov-stderr.log | tee reports/checkov/console.log || rc=$?
          cat reports/checkov/checkov-stderr.log >&2
          exit "$rc"

      # Verify that both frameworks were scanned, parsing succeeded, and no Checkov errors occurred.
      # JSON must be a valid array, both frameworks must be present, and no Checkov-format errors.
      - name: Check scan coverage
        run: |
          set -euo pipefail
          fail=0

          # Check that output files exist.
          [ -f reports/checkov/results_json.json ] || { echo "::error::results_json.json missing"; fail=1; }
          [ -f reports/checkov/results_sarif.sarif ] || { echo "::error::results_sarif.sarif missing"; fail=1; }

          # Verify JSON is an array (root structure from Checkov).
          if [ -f reports/checkov/results_json.json ]; then
            if ! jq -e 'type == "array"' reports/checkov/results_json.json >/dev/null 2>&1; then
              echo "::error::results_json.json is not a JSON array"; fail=1
            fi
          fi

          # Parse JSON: check both frameworks are present and parsing_errors == 0.
          # The framework list (dockerfile, github_actions) must match .checkov.yaml's framework: key.
          for framework in dockerfile github_actions; do
            if [ -f reports/checkov/results_json.json ]; then
              summary=$(jq --arg ft "$framework" '.[] | select(.check_type == $ft) | .summary' \
                reports/checkov/results_json.json 2>/dev/null || echo "{}")
              if [ -z "$summary" ] || [ "$summary" = "{}" ]; then
                echo "::error::framework $framework not found in results"; fail=1
              else
                errors=$(echo "$summary" | jq '.parsing_errors // 0')
                [ "$errors" -eq 0 ] || { echo "::error::$framework: $errors parsing errors"; fail=1; }
              fi
            fi
          done

          # Check that at least the expected files were scanned (union of file_path in passed + failed).
          if [ -f reports/checkov/results_json.json ]; then
            scanned=$(jq -r '.[] | .results | ((.passed_checks // []) + (.failed_checks // [])) | .[].file_path' \
              reports/checkov/results_json.json | sort -u)
            for expected in "/app/Dockerfile" "/app/infrastructure/Dockerfile" "/.github/workflows/security.yml"; do
              grep -qxF -- "$expected" <<<"$scanned" || { echo "::error::file not scanned: $expected"; fail=1; }
            done
          fi

          # Check for Checkov-format errors in both stderr and stdout (anchored log-line format).
          # Real error format: YYYY-MM-DD HH:MM:SS,mmm [ThreadName] [ERROR] or [CRITI] message
          # (CRITICAL is truncated to CRITI by %(levelname)-5.5s).
          for logfile in reports/checkov/checkov-stderr.log reports/checkov/console.log; do
            if [ -f "$logfile" ]; then
              if grep -Eq '^[0-9]{4}-[0-9]{2}-[0-9]{2} [0-9:,]+ \[[^]]*\] +\[(ERROR|CRITI)\]' "$logfile"; then
                echo "::error::Checkov logged errors (output write failure or malformed config)"; fail=1
              fi
            fi
          done

          # Print summary if parsing succeeded.
          if [ "$fail" -eq 0 ] && [ -f reports/checkov/results_json.json ]; then
            for framework in dockerfile github_actions; do
              jq -r --arg ft "$framework" '.[] | select(.check_type == $ft) | "checkov \(.check_type): \(.summary.passed) passed, \(.summary.failed) failed"' \
                reports/checkov/results_json.json
            done
          fi

          exit "$fail"

      - uses: actions/upload-artifact@v7
        with:
          name: checkov-reports
          path: |
            reports/checkov/results_json.json
            reports/checkov/results_sarif.sarif
            reports/checkov/console.log
            reports/checkov/checkov-stderr.log
          if-no-files-found: error
          retention-days: 7

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: checkov-reports-incomplete
          path: reports/checkov/
          if-no-files-found: ignore
          retention-days: 7
